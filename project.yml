name: FlashcardsApp
options:
  bundleIdPrefix: com.student.variant13
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  RealmSwift:
    url: https://github.com/realm/realm-swift.git
    from: 10.54.0
targets:
  FlashcardsApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [FlashcardsApp]
    dependencies:
      - package: RealmSwift
        product: RealmSwift
      - package: RealmSwift
        product: Realm
    info:
      path: FlashcardsApp/Info.plist
      properties:
        CFBundleDisplayName: "Flashcards"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
