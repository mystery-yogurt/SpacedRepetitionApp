name: SpacedRepetition
options:
  bundleIdPrefix: com.example
packages:
  Realm:
    url: https://github.com/realm/realm-swift.git
    from: 10.54.6
targets:
  SpacedRepetition:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    dependencies:
      - package: Realm
        product: RealmSwift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      INFOPLIST_KEY_NSCameraUsageDescription: "Камера используется для оптического распознавания слов (OCR)."
