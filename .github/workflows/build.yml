name: Build iOS Simulator App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | head -n 1)
          if [ -d "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16"
          else
            echo "Xcode 16 not found by wildcard, checking default..."
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project FlashcardsApp.xcodeproj

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project FlashcardsApp.xcodeproj \
                     -scheme FlashcardsApp \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Debug \
                     -derivedDataPath derived_data \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Archive Simulator .app to ZIP
        run: |
          cd derived_data/Build/Products/Debug-iphonesimulator
          zip -r FlashcardsApp-Simulator.zip FlashcardsApp.app
          mv FlashcardsApp-Simulator.zip ${{ github.workspace }}/

      - name: Upload Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashcardsApp-Simulator
          path: FlashcardsApp-Simulator.zip
